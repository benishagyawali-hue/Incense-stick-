        .cart-btn:hover {

            transition: transform 0.3s, background 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {

            transform: translateY(-2px);
        }

        /* Animated Smoke Effect */
        .smoke-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 300px;
            pointer-events: none;
            opacity: 0.4;
        }

        .smoke {
            position: absolute;
            bottom: 20px;
            left: 50%;
            width: 8px;
            height: 8px;
            background: rgba(156, 90, 43, 0.25);
            border-radius: 50%;
            filter: blur(8px);
            animation: rise 6s infinite ease-in;
        }

        .smoke:nth-child(2) { animation-delay: 2s; left: 48%; }
        .smoke:nth-child(3) { animation-delay: 4s; left: 52%; }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0.6; }
            50% { transform: translateY(-150px) translateX(15px) scale(4); opacity: 0.3; }
            100% { transform: translateY(-300px) translateX(-15px) scale(8); opacity: 0; }
        }

            cursor: pointer;
            font-weight: 500;
            color: var(--text-main);
            transition: all 0.3s;

        .filter-btn.active, .filter-btn:hover {
